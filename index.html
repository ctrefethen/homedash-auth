<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>HomeDash sign-in</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      font: 17px/1.5 -apple-system, system-ui, sans-serif; background: #000; color: #d8d8dd;
    }
    @media (prefers-color-scheme: light) { body { background: #f4f2ed; color: #1c1c1e; } }
    main { padding: 0 16px; max-width: 32rem; }
    a { color: #4c8df0; }
  </style>
</head>
<body>
  <main>
    <p id="message">Returning to HomeDash…</p>
    <p><a id="open" href="homedash://oauth">Open HomeDash</a></p>
  </main>
  <script>
    // OAuth redirect for HomeDash (Sonos, later TickTick). Providers require an HTTPS redirect,
    // so this page forwards the authorization code to the app's custom URL scheme.
    // The code is useless without the app's client secret, and the app checks `state`.
    const params = new URLSearchParams(location.search);
    const target = "homedash://oauth?" + params.toString();
    document.getElementById("open").href = target;
    if (params.has("code") || params.has("error")) {
      location.replace(target);
    } else {
      document.getElementById("message").textContent = "This page finishes HomeDash sign-in. There's nothing to do here.";
    }
  </script>
</body>
</html>
